version: '3'

services:

  # main bolna service
  bolna-app:
    build:
      context: .
      dockerfile: dockerfiles/bolna_server.Dockerfile
    image: bolna-app:latest  # This will tag the built image
    command: uvicorn local_setup.quickstart_server:app --host 0.0.0.0 --port 5001
    ports:
      - "5001:5001"
    depends_on:
      - redis
    environment:
      - BOLNA_HOST=0.0.0.0
      - BOLNA_PORT=5001
      - PYTHONPATH=/app
    env_file:
      - .env
    volumes:
      - ../:/app
      - $HOME/.aws/credentials:/root/.aws/credentials:ro
      - $HOME/.aws/config:/root/.aws/config:ro

  # redis service used as a persistent storage
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  #ngrok for local tunneling
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   restart: unless-stopped
  #   command:
  #     - "start"
  #     - "--all"
  #     - "--config"
  #     - "/etc/ngrok.yml"
  #   volumes:
  #     - ./ngrok-config.yml:/etc/ngrok.yml
  #   ports:
  #     - 4040:4040

  ngrok-twilio:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - start
      - --all
      - --config
      - /etc/ngrok.yml
    volumes:
      - ./ngrok-twilio.yml:/etc/ngrok.yml
    env_file:
      - .env
    ports:
      - "4040:4040"

  ngrok-bolna:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - start
      - --all
      - --config
      - /etc/ngrok.yml
    volumes:
      - ./ngrok-bolna.yml:/etc/ngrok.yml
    env_file:
      - .env
    ports:
      - "4041:4040"

  ### Telephony servers ###
  twilio-app:
    build:
      context: .
      dockerfile: dockerfiles/twilio_server.Dockerfile
    image: twilio-app:latest  # This will tag the built image
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - ngrok-twilio
      - bolna-app
    env_file:
      - .env

